<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d0c12">
<title>Аврорина неделя</title>
<style>body{margin:0;background:#0d0c12;color:#f3f1fa;font:16px system-ui,sans-serif;display:grid;place-items:center;min-height:100vh}.l{text-align:center;opacity:.85}.d{width:44px;height:44px;border-radius:50%;border:4px solid #3a2f5c;border-top-color:#a78bfa;margin:0 auto 14px;animation:s 1s linear infinite}@keyframes s{to{transform:rotate(360deg)}}</style>
</head>
<body>
<div class="l" id="l"><div class="d"></div>Аврорина неделя загружается…</div>
<script>
// Страница и данные хранятся в Google Apps Script; этот файл только загружает актуальную версию.
window.GAS_URL="https://script.google.com/macros/s/AKfycbzz49QbPk7GNApzCSv5wCOZdCszQfmcx9IyRjL0RIwMw5fOfYz_qc7uu9oWG78EPIW8/exec";
fetch(GAS_URL+"?api=page&t="+Date.now()).then(r=>r.text()).then(h=>{document.open();document.write('<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0d0c12"><script>window.GAS_URL='+JSON.stringify(GAS_URL)+'<\/script></head><body>'+h+'</body></html>');document.close()})
.catch(()=>{document.getElementById("l").textContent="Нет связи. Проверьте интернет и обновите страницу."});
</script>
</body>
</html>
